name: Release candidate validation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to validate before publication
        required: false
        default: main
      phase_c_evidence:
        description: Require Linux Phase C native race and path evidence
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Show validated commit and available check tools
        run: |
          echo "Validated commit SHA: $(git rev-parse HEAD)"
          shellcheck --version
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze --version
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare Phase C evidence
        if: ${{ inputs.phase_c_evidence }}
        env:
          EXPECTED_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(id -u)" -ne 0
          sudo -n true
          node --version
          mkdir -m 700 "$RUNNER_TEMP/recovery-evidence"
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/recovery-evidence/input.sha"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/recovery-evidence/workflow.sha"
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-evidence/checkout.sha"
          python --version > "$RUNNER_TEMP/recovery-evidence/runtime.txt"
          uname -sm >> "$RUNNER_TEMP/recovery-evidence/runtime.txt"
      - name: Validate without publication
        if: ${{ !inputs.phase_c_evidence }}
        run: python scripts/release.py --validate-only
      - name: Validate with Phase C evidence
        if: ${{ inputs.phase_c_evidence }}
        env:
          PYTEST_ADDOPTS: -x --junitxml=${{ runner.temp }}/recovery-evidence/full.xml
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 022
          python scripts/release.py --validate-only 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/validate.log"
      - name: Verify Phase C evidence paths
        if: ${{ inputs.phase_c_evidence }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          umask 022
          python -m pytest -q -s -x -p no:cacheprovider tests/test_recovery_directory_security.py --junitxml="$RUNNER_TEMP/recovery-evidence/focused.xml" 2>&1 | tee "$RUNNER_TEMP/recovery-evidence/focused.log"
          git rev-parse HEAD > "$RUNNER_TEMP/recovery-evidence/validated.sha"
          python tests/recovery_ci_evidence.py "$RUNNER_TEMP/recovery-evidence" | tee "$RUNNER_TEMP/recovery-evidence/proof-summary.log"
          test -z "$(git status --porcelain)"
      - name: Preserve Phase C evidence
        if: ${{ always() && inputs.phase_c_evidence }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-linux-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-evidence/
          if-no-files-found: error
